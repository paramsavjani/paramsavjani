<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="196" viewBox="0 0 1000 196" role="img" aria-labelledby="title desc">
  <title id="title">Impact dashboard</title>
  <desc id="desc">60% lower query latency at Fleetway, 1,000+ Play Store installs and 2,300+ students tracked on Attendance IO, and 16 actions in an async OpenAI connector at UnifyApps.</desc>
  <defs>
    <clipPath id="card"><rect width="1000" height="196" rx="16"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
      .panel { fill: #161b22; stroke: #30363d; }
      .title { font-size: 11.5px; font-weight: 600; fill: #7d8590; letter-spacing: 0.8px; }
      .value { font-size: 38px; font-weight: 700; }
      .note { font-size: 11px; fill: #6e7681; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 1.4s ease-out both; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="196" fill="#0d1117"/>
    <rect width="1000" height="40" fill="#161b22"/>
    <line x1="0" y1="40.5" x2="1000" y2="40.5" stroke="#30363d"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="195" rx="16" fill="none" stroke="#30363d"/>

  <!-- dashboard header -->
  <g fill="#7d8590">
    <rect x="20" y="14" width="5" height="5" rx="1"/>
    <rect x="27" y="14" width="5" height="5" rx="1"/>
    <rect x="20" y="21" width="5" height="5" rx="1"/>
    <rect x="27" y="21" width="5" height="5" rx="1"/>
  </g>
  <text x="42" y="25" class="mono" font-size="12.5" fill="#7d8590">dashboards / param / <tspan fill="#e6edf3" font-weight="600">impact</tspan></text>
  <circle cx="856" cy="20.5" r="4" fill="#3fb950" class="pulse"/>
  <text x="866" y="25" class="mono" font-size="12" fill="#3fb950">live</text>
  <rect x="902" y="10" width="80" height="21" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="942" y="25" class="mono" font-size="11.5" fill="#c9d1d9" text-anchor="middle">all time ▾</text>

  <!-- panel 1: latency -->
  <rect x="16.5" y="56.5" width="232" height="122" rx="8" class="panel"/>
  <rect x="16.5" y="56.5" width="232" height="3" rx="1.5" fill="#3fb950"/>
  <text x="32" y="84" class="sans title">QUERY LATENCY</text>
  <text x="32" y="132" class="sans value" fill="#3fb950">↓60%</text>
  <text x="32" y="160" class="mono note">fleetway · pg/minio migration</text>
  <rect x="190" y="88" width="16" height="48" rx="2" fill="#484f58" class="grow"/>
  <rect x="212" y="117" width="16" height="19" rx="2" fill="#3fb950" class="grow"/>
  <text x="198" y="146" class="mono" font-size="8.5" fill="#6e7681" text-anchor="middle">pre</text>
  <text x="220" y="146" class="mono" font-size="8.5" fill="#6e7681" text-anchor="middle">post</text>

  <!-- panel 2: installs -->
  <rect x="260.5" y="56.5" width="232" height="122" rx="8" class="panel"/>
  <rect x="260.5" y="56.5" width="232" height="3" rx="1.5" fill="#58a6ff"/>
  <text x="276" y="84" class="sans title">PLAY STORE INSTALLS</text>
  <text x="276" y="132" class="sans value" fill="#58a6ff">1,000+</text>
  <text x="276" y="160" class="mono note">attendance io · in production</text>

  <!-- panel 3: students -->
  <rect x="504.5" y="56.5" width="232" height="122" rx="8" class="panel"/>
  <rect x="504.5" y="56.5" width="232" height="3" rx="1.5" fill="#bc8cff"/>
  <text x="520" y="84" class="sans title">STUDENTS TRACKED</text>
  <text x="520" y="132" class="sans value" fill="#bc8cff">2,300+</text>
  <text x="520" y="160" class="mono note">attendance io · campus-wide</text>

  <!-- panel 4: connector -->
  <rect x="748.5" y="56.5" width="232" height="122" rx="8" class="panel"/>
  <rect x="748.5" y="56.5" width="232" height="3" rx="1.5" fill="#f0883e"/>
  <text x="764" y="84" class="sans title">ASYNC CONNECTOR ACTIONS</text>
  <text x="764" y="132" class="sans value" fill="#f0883e">16</text>
  <text x="764" y="160" class="mono note">unifyapps · openai connector</text>
</svg>
